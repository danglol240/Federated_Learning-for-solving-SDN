project:
  name: FL-SDN DDoS Detection - So sanh FedAvg/FedProx/FedNova duoi Non-IID
  seed: 42
sdn:
  controller_port: 6653
  openflow_version: OpenFlow13
  num_zones: 3
  switches_per_zone: 2
  hosts_per_switch: 2
  stats_interval: 10
data:
  dataset: CICDDoS2019
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  test_size: 0.2
  val_size: 0.1
  live_validation_dir: data/captures
task:
  mode: binary
  binary:
    num_classes: 2
    classes:
    - benign
    - attack
  multiclass:
    num_classes: 13
    classes:
    - benign
    - ldap
    - mssql
    - netbios
    - portmap
    - syn
    - udp
    - udplag
    - webddos
    - dns
    - ntp
    - snmp
    - tftp
model:
  type: cnn1d
  input_dim: 30
  hidden_dim: 128
  dropout: 0.3
fl:
  num_clients: 3
  num_rounds: 1
  local_epochs: 5
  client_local_epochs:
  - 1
  - 4
  - 8
  batch_size: 64
  learning_rate: 0.001
  strategy: fedavg
  fedprox_mu: 0.01
  fraction_fit: 1.0
  min_fit_clients: 3
  min_available_clients: 3
  noniid_by: attack_type
