# ===== CAU HINH CHUNG CHO DO AN =====
# Trong tam hien tai (theo quyet dinh 2026-09-09): so sanh FedAvg/FedProx/FedNova
# duoi Non-IID cho bai toan DDoS detection trong SDN. Cau hinh QoS 4-lop
# (ISCX-VPN2016) van giu trong qos_mapping.yaml cho giai doan sau, chua active.

project:
  name: "FL-SDN DDoS Detection - So sanh FedAvg/FedProx/FedNova duoi Non-IID"
  seed: 42

# ----- Mang SDN -----
sdn:
  controller_port: 6653
  openflow_version: "OpenFlow13"
  num_zones: 3
  switches_per_zone: 2
  hosts_per_switch: 2
  stats_interval: 10        # giay, chu ky thu flow statistics

# ----- Du lieu -----
data:
  dataset: "CICDDoS2019"    # CSV da trich dac trung qua CICFlowMeter, tai tu Kaggle (vd dhoogla/cicddos2019)
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  test_size: 0.2
  val_size: 0.1
  live_validation_dir: "data/captures"   # CSV Mininet/hping3 tu sinh (Giai doan 2) - CHI de validate mo hinh tren traffic that, KHONG dung de train

# ----- Bai toan phan loai -----
# mode dang active quyet dinh model/output layer dung ban nao. Lam ca 2 ban
# (binary lam truoc, multiclass nang cap sau) theo yeu cau.
task:
  mode: "binary"        # binary | multiclass
  binary:
    num_classes: 2
    classes: [benign, attack]
  multiclass:
    num_classes: 13         # benign + 12 loai tan cong - da mo rong tu 9 len 13 (them dns/ntp/snmp/tftp)
                             # de dung het du lieu that (ban 9 lop cu lam mat 52% dong vi 4 loai nay
                             # khong nam trong danh sach - xem docs/ROADMAP.md)
    classes: [benign, ldap, mssql, netbios, portmap, syn, udp, udplag, webddos, dns, ntp, snmp, tftp]

# ----- Mo hinh -----
model:
  type: "cnn1d"             # mlp | cnn1d | lstm | gru
  input_dim: 30             # KHONG dung nua - code tu doc so cot that tu data/splits/client_1/train.csv (xem src/fl/dataset.py:infer_input_dim). Giu lai chi de tham khao.
  hidden_dim: 128
  dropout: 0.3

# ----- Federated Learning -----
fl:
  num_clients: 3
  num_rounds: 50
  local_epochs: 1           # giam tu 5 - it buoc local hon giua cac round -> lam ro objective inconsistency ma FedNova xu ly
  batch_size: 64
  learning_rate: 0.001
  strategy: "fedavg"        # fedavg | fedprox | fednova
  fedprox_mu: 0.01
  # fedavg, fedprox: co san trong flwr (flwr.server.strategy.FedProx da verify tren flwr==1.34.0)
  # fednova: KHONG co san trong flwr, phai tu cai dat Strategy rieng (xem src/fl/)
  fraction_fit: 0.34        # Scenario S4 (2026-09-14): participation cuc thap - chi 1/3 client moi round
  min_fit_clients: 1        # ep fraction_fit thuc su co tac dung (truoc day bi min_fit_clients=min_available_clients=3 de len, xem src/fl/server.py)
  min_available_clients: 3
  noniid_by: "attack_type"  # cach chia non-IID giua 3 client: moi client thien lech ve 1/vai loai attack trong CICDDoS2019 (xem config/noniid_distribution.yaml se viet lai cho phu hop)
